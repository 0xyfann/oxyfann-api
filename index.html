
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OXYFANN API Dashboard</title>
  <style>
    body {
      background: #080d18;
      color: #00ff99;
      font-family: monospace;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      margin: 25px auto;
      padding: 20px;
      border: 1px solid #00ff99;
      border-radius: 14px;
      box-shadow: 0 0 18px #00ff9930;
    }
    button {
      background: #00ff99;
      color: #08120e;
      border: 0;
      padding: 12px;
      margin: 4px 0;
      border-radius: 7px;
      font-weight: bold;
    }
    pre {
      color: #d7ffe9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .online { color: #00ff99; }
    .error { color: #ff6969; }
  </style>
</head>
<body>
  <div class="card">
    <h2>OXYFANN API</h2>
    <p>Status: <span id="status">Siap</span></p>

    <button onclick="loadAPI('data.json')">
      Tes Profil API
    </button>

    <button onclick="loadAPI('status.json')">
      Tes Status API
    </button>

    <pre id="result">Pilih endpoint untuk mulai.</pre>
  </div>

  <script>
    async function loadAPI(endpoint) {
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      status.textContent = "Memuat...";
      status.className = "";
      result.textContent = "";

      try {
        const response = await fetch("./" + endpoint);

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        status.textContent = "ONLINE";
        status.className = "online";
        result.textContent =
          JSON.stringify(data, null, 2);
      } catch (error) {
        status.textContent = "ERROR";
        status.className = "error";
        result.textContent = error.message;
      }
    }
  </script>
</body>
</html>
